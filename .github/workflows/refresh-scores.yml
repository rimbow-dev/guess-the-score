name: Refresh movie scores
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays, early morning US time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python crawler/crawl.py
      - name: Save scores.json
        run: |
          git config user.name "scores-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json
          git diff --cached --quiet || (git commit -m "Refresh movie scores" && git push)
